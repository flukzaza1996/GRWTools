<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GRW Map — Ghost Recon Wildlands</title>
  <meta name="description" content="Interactive collectibles map for Ghost Recon Wildlands: weapons, attachments, skill points, medals, rebel resources, vehicles and missions." />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="fatal" class="fatal" hidden></div>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <header class="sidebar__head">
      <div>
        <h1 class="sidebar__title" data-i18n="app.title"></h1>
        <p class="sidebar__sub" data-i18n="app.subtitle"></p>
      </div>
      <div class="sidebar__chrome">
        <button type="button" class="iconbtn" id="lang-toggle" title="TH / EN"></button>
        <button type="button" class="iconbtn" id="theme-toggle"
                data-i18n-attr="title:theme.toggle" aria-label="theme">◐</button>
        <button type="button" class="iconbtn sidebar__close" id="sidebar-close" aria-label="close">&times;</button>
      </div>
    </header>

    <div class="search">
      <input type="search" id="search-input" class="search__input" autocomplete="off"
             data-i18n-attr="placeholder:search.placeholder" />
      <button type="button" class="search__clear" id="search-clear"
              data-i18n-attr="title:search.clear" aria-label="clear">&times;</button>
      <ul class="search__results" id="search-results" hidden></ul>
    </div>

    <section class="panel">
      <h2 class="panel__title" data-i18n="region.title"></h2>
      <select class="select" id="region-select"></select>
    </section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title" data-i18n="filter.title"></h2>
        <div class="panel__actions">
          <button type="button" class="linkbtn" id="filter-all" data-i18n="filter.all"></button>
          <button type="button" class="linkbtn" id="filter-none" data-i18n="filter.none"></button>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="hide-found" />
        <span data-i18n="filter.hideFound"></span>
      </label>
      <div id="filter-tree"></div>
    </section>

    <section class="panel">
      <h2 class="panel__title" data-i18n="progress.title"></h2>
      <div class="progress" id="progress-bar"><i></i></div>
      <p class="progress__count" id="progress-count"></p>
      <div class="panel__actions">
        <button type="button" class="linkbtn" id="progress-reset" data-i18n="progress.reset"></button>
        <button type="button" class="linkbtn" id="progress-export" data-i18n="progress.export"></button>
        <label class="linkbtn" role="button">
          <span data-i18n="progress.import"></span>
          <input type="file" id="progress-import" accept="application/json,.json" hidden />
        </label>
      </div>
    </section>

    <footer class="sidebar__foot">
      <p class="datasource" id="data-source" hidden>
        <b data-i18n="data.localBadge"></b>
        <span data-i18n="data.localNote"></span>
      </p>
      <p data-i18n="footer.disclaimer"></p>
      <p data-i18n="footer.itemCredit"></p>
      <p data-i18n="footer.markerCredit"></p>
    </footer>
  </aside>

  <main class="stage">
    <div id="map"></div>

    <button type="button" class="fab" id="sidebar-toggle"
            data-i18n-attr="title:sidebar.toggle" aria-label="menu">
      <span></span><span></span><span></span>
    </button>

    <div class="empty" id="empty" hidden>
      <h2 data-i18n="map.empty.title"></h2>
      <p data-i18n="map.empty.body"></p>
    </div>
  </main>

  <aside class="editor" id="editor" hidden></aside>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
