# Publishes the repository to GitHub Pages as-is. There is no build step: the
# site is plain HTML, ES modules and a pre-cut tile pyramid, so the checkout is
# the artifact.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it — a half-uploaded
# tile pyramid is worse than a slightly stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be switched on with Settings > Pages > Source:
      # "GitHub Actions". The action's `enablement: true` cannot do it for you —
      # creating a Pages site needs admin rights, which GITHUB_TOKEN lacks.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
